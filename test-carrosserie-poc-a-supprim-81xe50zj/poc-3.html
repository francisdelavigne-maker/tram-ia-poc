<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réception véhicule assistée – POC TEST Carrosserie POC (à supprimer)</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1b2430;--muted:#5d6b7c;--line:#dde3ea;--accent:#0b5ea8;--accent-d:#084a86;--accent-l:#e6f0fa;
--r:12px;--sh:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7fb3e6;outline-offset:2px}
.top{background:#14263a;color:#fff;border-bottom:4px solid var(--accent)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:19px;line-height:1.2}
.brand p{margin:2px 0 0;font-size:13px;color:#b9c7d8}
.tag{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:20px;font-size:12.5px;letter-spacing:.2px}
main{padding:22px 0 30px}
.intro h2{margin:0 0 4px;font-size:22px}
.intro p{margin:0 0 18px;color:var(--muted);max-width:820px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh)}
.kpi .lab{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .val{font-size:27px;font-weight:700;margin:5px 0 2px;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .val em{font-style:normal;font-size:12px;font-weight:700;background:#dcfce7;color:#166534;padding:2px 7px;border-radius:10px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.bar-t{height:6px;background:#e7ecf2;border-radius:4px;margin-top:9px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s ease}
.bump .val{animation:bump .7s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.07);color:var(--accent)}100%{transform:scale(1)}}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;box-shadow:var(--sh)}
.cta{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--accent-d);transition:transform .1s,background .15s}
.cta:hover{background:var(--accent-d)}
.cta:active{transform:translateY(1px)}
.ghost{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px;color:var(--muted);font-size:13.5px}
.ghost:hover{border-color:#b7c3d1;color:var(--ink)}
.search{flex:1 1 180px;min-width:150px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcfd}
.chips{display:flex;flex-wrap:wrap;gap:7px;width:100%}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip b{margin-left:4px;color:var(--ink)}
.chip.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
h3.sec{margin:0 0 10px;font-size:16px}
.ev{background:var(--card);border:1px solid var(--line);border-left:4px solid #b7c3d1;border-radius:var(--r);margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
.ev.s-pre{border-left-color:#64748b}.ev.s-photos{border-left-color:#2563eb}.ev.s-devis{border-left-color:#d97706}.ev.s-anomalie{border-left-color:#dc2626}.ev.s-expert{border-left-color:#16a34a}
.head{width:100%;background:none;border:0;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto 54px 20px;gap:12px;align-items:center;padding:11px 14px}
.head:hover{background:#f8fafc}
.plate{font:700 13.5px/1 ui-monospace,Consolas,monospace;letter-spacing:1px;background:#fff;border:2px solid #1d3a63;border-radius:5px;padding:6px 8px;color:#10233f;white-space:nowrap}
.main b{font-weight:650}
.main small,.meta small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;text-align:right;white-space:nowrap}
.dur{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);transition:transform .2s}
.ev.open .chev{transform:rotate(180deg)}
.badge{font-size:12px;font-weight:650;padding:4px 10px;border-radius:14px;white-space:nowrap}
.badge.pre{background:#e8edf3;color:#334155}.badge.photos{background:#dbeafe;color:#1d4ed8}.badge.devis{background:#fef3c7;color:#92400e}.badge.anomalie{background:#fee2e2;color:#991b1b}.badge.expert{background:#dcfce7;color:#166534}
.body{display:none;border-top:1px solid var(--line);padding:16px;background:#fbfcfd}
.ev.open .body{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.body h4{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.info{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;margin-bottom:14px}
.info span{color:var(--muted)}.info b{color:var(--ink);font-weight:600}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:5px 0;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:11px;top:29px;bottom:-4px;width:2px;background:var(--line)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#e7ecf2;color:var(--muted);flex:none}
.steps b{font-size:13.5px;font-weight:600}.steps small{display:block;color:var(--muted);font-size:12px}
.steps .done .dot{background:#16a34a;color:#fff}.steps .cur .dot{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-l)}.steps .err .dot{background:#dc2626;color:#fff;box-shadow:0 0 0 4px #fee2e2}
.steps .todo b{color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tile{border-radius:8px;padding:7px 8px;font-size:12px;border:1px solid var(--line);background:#fff;position:relative;padding-left:26px}
.tile b{display:block;font-weight:600;font-size:12px}.t
<!-- fichier tronqué : fermeture automatique -->
</script></body></html>
