<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POC – Pré-dossier de réception véhicule | Carrosserie</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#e2e7ee;--acc:#0b5ed7;--accd:#0a4aa8;--ok:#1e8e4e;--warn:#d98a00;--bad:#d03b3b;--info:#6a4fd1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
header{background:#14202e;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header .brand{display:flex;align-items:center;gap:12px}
header .logo{width:38px;height:38px;border-radius:9px;background:var(--acc);display:grid;place-items:center;font-weight:700}
header h1{font-size:17px;font-weight:600}
header small{display:block;color:#9fb0c4;font-size:12px;font-weight:400}
header .tag{background:#22344a;border:1px solid #2f4764;padding:6px 12px;border-radius:20px;font-size:12px;color:#cfdcec}
main{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:22px 18px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,32,46,.04)}
.kpi .lbl{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.kpi .val{font-size:28px;font-weight:700;color:var(--ink);transition:transform .3s}
.kpi .val.bump{transform:scale(1.12);color:var(--acc)}
.kpi .sub{font-size:12px;color:var(--ok);margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .6s}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.btn{background:var(--acc);color:#fff;border:0;padding:12px 20px;border-radius:9px;font-size:14.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(11,94,215,.3);transition:background .2s,transform .1s}
.btn:hover{background:var(--accd)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:7px 13px;font-size:13px;font-weight:500}
.btn.sec:hover{background:#eef2f7}
.btn.sm{padding:7px 13px;font-size:12.5px;box-shadow:none}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#17773f}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .btn.sec.on{background:#14202e;color:#fff;border-color:#14202e}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item.new{animation:pop .6s ease-out;border-color:var(--acc);box-shadow:0 0 0 3px rgba(11,94,215,.15)}
@keyframes pop{0%{opacity:0;transform:translateY(-18px) scale(.97)}100%{opacity:1;transform:none}}
.head{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;flex-wrap:wrap}
.head:hover{background:#f8fafc}
.plate{font-family:"Courier New",monospace;font-weight:700;background:#fff;border:2px solid #14202e;border-radius:6px;padding:3px 9px;font-size:13.5px;letter-spacing:1px;min-width:108px;text-align:center}
.who{flex:1;min-width:180px}
.who b{display:block;font-size:14.5px}
.who span{font-size:12.5px;color:var(--mut)}
.time{font-size:12px;color:var(--mut);min-width:60px;text-align:right}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;white-space:nowrap}
.s-comp{background:#e3f5ea;color:var(--ok)}
.s-inc{background:#fff1d6;color:#a86500}
.s-val{background:#e7efff;color:var(--acc)}
.s-exp{background:#eee9fb;color:var(--info)}
.s-rel{background:#fde5e5;color:var(--bad)}
.chev{color:var(--mut);transition:transform .25s}
.item.open .chev{transform:rotate(90deg)}
.body{display:none;border-top:1px solid var(--line);padding:16px;background:#fbfcfe}
.item.open .body{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.box h4{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.box p{font-size:13.5px;margin-bottom:4px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:62px;height:46px;border-radius:6px;background:linear-gradient(135deg,#cfd8e3,#a9b6c6);display:grid;place-items:center;font-size:10px;color:#44546a;border:1px solid #b9c5d4}
.ph.miss{background:#fff;border:1.5px dashed var(--bad);color:var(--bad)}
.chk{list-style:none}
.chk li{font-size:13.5px;padding:3px 0;display:flex;gap:8px}
.chk li.y::before{content:"✓";color:var(--ok);font-weight:700}
.chk li.n::before{content:"✗";color:var(--bad);font-weight:700}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:30px;background:#fff;border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;bottom:24px;right:24px;background:#14202e;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none;max-width:320px;z-index:9}
.toast.show{opacity:1;transform:none}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:16px;border-top:1px solid var(--line);background:#fff}
@media(max-width:600px){.time{display:none}.kpi .val{font-size:24px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">R</div>
    <h1>TEST Lien Notion (à supprimer)<small>Carrosserie · Salon-de-Provence · Pré-dossier de réception véhicule</small></h1>
  </div>
  <span class="tag">Réception véhicule · Démo</span>
</header>
<main>
  <h2>Indicateurs de performance</h2>
  <section class="kpis" id="kpis"></section>

  <div class="toolbar">
    <h2 style="margin:0">Historique des réceptions</h2>
    <button class="btn" id="simBtn">⚡ Simuler une arrivée de véhicule</button>
  </div>
  <div class="filters" id="filters" style="margin-bottom:14px"></div>
  <section class="list" id="list"></section>
</main>
<footer>Démonstration – données fictives – TRAM IA</footer>
<div class="toast" id="toast"></div>

<script type="application/json" id="mock-data">
{
 "statuts":{
  "complet":{"label":"Dossier complet","cls":"s-comp"},
  "incomplet":{"label":"Pièces manquantes","cls":"s-inc"},
  "valide":{"label":"Devis à valider","cls":"s-val"},
  "expert":{"label":"Envoyé à l'expert","cls":"s-exp"},
  "relance":{"label":"Relance expert","cls":"s-rel"}
 },
 "initial":[
  {"plaque":"GH-482-LP","client":"Mme Martin","type":"Assurance","veh":"Peugeot 308","choc":"Choc avant gauche, aile et phare","heure":"08:15","statut":"expert","photos":6,"miss":0,"devis":"1 240 €","expert":"Cabinet Expertis","checks":[1,1,1,1,1]},
  {"plaque":"FK-917-RT","client":"M. Bernard","type":"Particulier","veh":"Renault Clio V","choc":"Rayure portière droite, pare-chocs arrière","heure":"08:50","statut":"complet","photos":6,"miss":0,"devis":"680 €","expert":"Sans expert","checks":[1,1,1,1,1]},
  {"plaque":"EB-203-MC","client":"M. Garcia","type":"Assurance","veh":"Citroën C3","choc":"Choc arrière, coffre enfoncé","heure":"09:20","statut":"incomplet","photos":4,"miss":2,"devis":"Brouillon","expert":"AutoExpert 13","checks":[1,1,0,0,0]},
  {"plaque":"DM-655-QA","client":"Mme Rossi","type":"Assurance","veh":"Dacia Sandero","choc":"Choc latéral gauche, deux portières","heure":"10:05","statut":"valide","photos":6,"miss":0,"devis":"2 105 €","expert":"Cabinet Expertis","checks":[1,1,1,1,0]},
  {"plaque":"CX-318-ZN","client":"M. Leroy","type":"Particulier","veh":"Toyota Yaris","choc":"Pare-chocs avant fendu","heure":"10:40","statut":"relance","photos":6,"miss":0,"devis":"950 €","expert":"AutoExpert 13","checks":[1,1,1,1,1]},
  {"plaque":"BV-774-HD","client":"M. Faure","type":"Assurance","veh":"Volkswagen Golf","choc":"Choc toit et montant, grêle","heure":"11:10","statut":"complet","photos":6,"miss":0,"devis":"3 480 €","expert":"Cabinet Expertis","checks":[1,1,1,1,1]}
 ],
 "scenarios":[
  {"plaque":"AN-126-SP","client":"Mme Dupuis","type":"Assurance","veh":"Ford Fiesta","choc":"Choc avant droit, capot et optique","statut":"valide","photos":6,"miss":0,"devis":"1 560 €","expert":"Cabinet Expertis","checks":[1,1,1,1,0]},
  {"plaque":"HT-590-KL","client":"M. Moreau","type":"Particulier","veh":"Opel Corsa","choc":"Rayures aile arrière gauche","statut":"complet","photos":6,"miss":0,"devis":"420 €","expert":"Sans expert","checks":[1,1,1,1,1]},
  {"plaque":"JR-841-WB","client":"Mme Petit","type":"Assurance","veh":"Fiat 500","choc":"Choc arrière, feu et pare-chocs","statut":"incomplet","photos":5,"miss":1,"devis":"Brouillon","expert":"AutoExpert 13","checks":[1,1,1,0,0]},
  {"plaque":"KD-337-NE","client":"M. Simon","type":"Assurance","veh":"Mercedes Classe A","choc":"Choc latéral droit, porte et seuil","statut":"valide","photos":6,"miss":0,"devis":"2 790 €","expert":"Cabinet Expertis","checks":[1,1,1,1,0]},
  {"plaque":"LP-702-AC","client":"M. Roux","type":"Particulier","veh":"Peugeot 208","choc":"Éclat de peinture capot","statut":"complet","photos":6,"miss":0,"devis":"310 €","expert":"Sans expert","checks":[1,1,1,1,1]}
 ]
}
</script>

<script>
(function(){
  var D=JSON.parse(document.getElementById('mock-data').textContent);
  var ST=D.statuts, items=[], filter='tous', idx=0, openId=null, uid=0;
  var CHK=["Photos du véhicule (liste standard)","Plaque lue automatiquement","Fiche client pré-remplie","Devis pré-rempli","Dossier complet validé"];
  var K={recus:0,min:0,complets:0,envoyes:0};

  function now(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2400);}

  function prep(o,isNew){var c={};for(var k in o)c[k]=o[k];c.id=++uid;c.isNew=!!isNew;if(!c.heure)c.heure=now();return c;}

  function renderKpis(){
    var totalDossiers=K.recus;
    var gain=Math.round((totalDossiers*12)/60*10)/10;
    var base=15; // h/semaine déclarées
    var h=(2.4+totalDossiers*0.2).toFixed(1).replace('.',',');
    var pct=totalDossiers?Math.round(K.complets/totalDossiers*100):0;
    var tpl=[
      {l:"Temps moyen de réception",v:"18 min",s:"vs 30 min avant · −40 %",b:60},
      {l:"Temps gagné cette semaine",v:h+" h",s:"objectif ≈ 6 h/semaine",b:Math.min(100,(parseFloat(h.replace(',','.'))/6)*100)},
      {l:"Dossiers complets du 1er coup",v:pct+" %",s:K.complets+" sur "+totalDossiers+" dossiers",b:pct},
      {l:"Envoyés à l'expert",v:K.envoyes,s:"délai moyen d'envoi : 4 min",b:Math.min(100,K.envoyes*14)}
    ];
    var el=document.getElementById('kpis');
    el.innerHTML=tpl.map(function(k){return '<div class="kpi"><div class="lbl">'+k.l+'</div><div class="val">'+k.v+'</div><div class="sub">'+k.s+'</div><div class="bar"><i style="width:'+Math.round(k.b)+'%"></i></div></div>';}).join('');
  }
  function bump(){var v=document.querySelectorAll('.kpi .val');for(var i=0;i<v.length;i++){(function(e){e.classList.add('bump');setTimeout(function(){e.classList.remove('bump');},500);})(v[i]);}}

  function recount(){
    K.recus=items.length;K.complets=0;K.envoyes=0;
    items.forEach(function(it){
      if(it.statut==='complet'||it.statut==='expert'||it.statut==='relance'||it.statut==='valide'&&it.miss===0&&it.checks[4]===1)K.complets++;
      if(it.statut==='expert'||it.statut==='relance')K.envoyes++;
    });
  }

  function renderFilters(){
    var f=[['tous','Tous']];for(var k in ST)f.push([k,ST[k].label]);
    document.getElementById('filters').innerHTML=f.map(function(x){
      var n=x[0]==='tous'?items.length:items.filter(function(i){return i.statut===x[0];}).length;
      return '<button class="btn sec'+(filter===x[0]?' on':'')+'" data-f="'+x[0]+'">'+x[1]+' ('+n+')</button>';
    }).join('');
    var bs=document.querySelectorAll('#filters button');
    for(var i=0;i<bs.length;i++)bs[i].onclick=function(){filter=this.getAttribute('data-f');renderAll();};
  }

  function photosHtml(it){
    var h='';for(var i=0;i<it.photos;i++)h+='<div class="ph">📷 '+(i+1)+'</div>';
    for(var j=0;j<it.miss;j++)h+='<div class="ph miss">manque</div>';
    return h;
  }

  function itemHtml(it){
    var s=ST[it.statut];
    var chk=CHK.map(function(c,i){return '<li class="'+(it.checks[i]?'y':'n')+'">'+c+'</li>';}).join('');
    var act='';
    if(it.statut==='incomplet')act='<button class="btn sm" data-a="relancer" data-id="'+it.id+'">Relancer le client (pièces)</button>';
    if(it.statut==='valide'||it.statut==='complet')act='<button class="btn sm ok" data-a="envoyer" data-id="'+it.id+'">Valider et envoyer à l\'expert</button>';
    if(it.statut==='relance')act='<button class="btn sm" data-a="envoyer" data-id="'+it.id+'">Renvoyer le dossier à l\'expert</button>';
    if(it.statut==='expert')act='<button class="btn sm" data-a="relance" data-id="'+it.id+'">Marquer « relance expert »</button>';
    return '<div class="item'+(it.isNew?' new':'')+(openId===it.id?' open':'')+'" data-id="'+it.id+'">'+
      '<div class="head" data-t="'+it.id+'"><span class="plate">'+it.plaque+'</span>'+
      '<div class="who"><b>'+it.client+' · '+it.veh+'</b><span>'+it.type+' · '+it.choc+'</span></div>'+
      '<span class="time">'+it.heure+'</span><span class="badge '+s.cls+'">'+s.label+'</span><span class="chev">▶</span></div>'+
      '<div class="body"><div class="grid">'+
      '<div class="box"><h4>Photos guidées</h4><div class="photos">'+photosHtml(it)+'</div></div>'+
      '<div class="box"><h4>Contrôle de complétude</h4><ul class="chk">'+chk+'</ul></div>'+
      '<div class="box"><h4>Dossier</h4><p><b>Devis :</b> '+it.devis+'</p><p><b>Expert :</b> '+it.expert+'</p><p><b>Dommage :</b> '+it.choc+'</p></div>'+
      '</div><div class="actions">'+act+'</div></div></div>';
  }

  function renderList(){
    var l=items.filter(function(i){return filter==='tous'||i.statut===filter;});
    var el=document.getElementById('list');
    el.innerHTML=l.length?l.map(itemHtml).join(''):'<div class="empty">Aucun dossier dans cette catégorie.</div>';
    var hs=el.querySelectorAll('[data-t]');
    for(var i=0;i<hs.length;i++)hs[i].onclick=function(){var id=+this.getAttribute('data-t');openId=(openId===id)?null:id;renderList();};
    var as=el.querySelectorAll('[data-a]');
    for(var j=0;j<as.length;j++)as[j].onclick=function(e){e.stopPropagation();act(this.getAttribute('data-a'),+this.getAttribute('data-id'));};
    items.forEach(function(it){it.isNew=false;});
  }

  function act(a,id){
    var it=items.filter(function(x){return x.id===id;})[0];if(!it)return;
    if(a==='relancer'){it.statut='valide';it.miss=0;it.photos=6;it.checks=[1,1,1,1,0];it.devis=it.devis==='Brouillon'?'1 180 €':it.devis;toast('Relance envoyée : pièces reçues, devis à valider');}
    else if(a==='envoyer'){it.statut='expert';it.checks=[1,1,1,1,1];toast('Dossier '+it.plaque+' envoyé à '+it.expert);}
    else if(a==='relance'){it.statut='relance';toast('Relance expert programmée pour '+it.plaque);}
    renderAll();
  }

  function renderAll(){recount();renderKpis();renderFilters();renderList();}

  document.getElementById('simBtn').onclick=function(){
    var sc=D.scenarios[idx%D.scenarios.length];idx++;
    var it=prep(sc,true);
    items.unshift(it);filter='tous';openId=it.id;
    renderAll();bump();
    toast('Nouveau véhicule reçu : '+it.plaque+' · pré-dossier constitué');
  };

  D.initial.forEach(function(o){items.push(prep(o,false));});
  renderAll();
})();
</script>
</body>
</html>
